name: Maven CI

# Triggers manually or on push or pull request on the main branch
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Runs the Maven test phase on the project
  maven_test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'zulu'
          cache: maven

      # Run tests and generate the project website
      - name: Test with Maven
        run: mvn test site

      # Save the build to GitHub Cache
      - name: Cache Maven build
        uses: actions/cache@v4
        with:
          path: |
            target
          key: maven-build-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload test report as artifact
        uses: actions/upload-artifact@v6
        with:
          name: Test report
          path: target/site

  # Uploads dependency graph to GitHub to receive Dependabot alerts
  update_dependence_graph:
    runs-on: ubuntu-latest
    needs: [maven_test]

    permissions:
      contents: write

    steps:
      # Restore the build cached by maven_test
      - name: Restore Maven build
        uses: actions/cache/restore@v4
        with:
          path: |
            target
          key: maven-build-${{ github.run_id }}-${{ github.run_attempt }}

      # Update dependency graph
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v5